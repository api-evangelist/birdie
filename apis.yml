aid: birdie
name: Birdie
description: 'Birdie is a UK homecare technology platform that gives domiciliary
  care agencies a single unified system for care management, rostering and scheduling,
  finance and invoicing, quality and compliance, medication management and clinically-validated
  assessments, backed by dedicated apps for carers and families. Over 1,000 homecare
  providers use Birdie to save time, reduce mistakes and evidence care quality, with
  a Q-Score that predicts CQC ratings in real time. Birdie is UK-hosted and holds
  ISO 27001, Cyber Essentials Plus and NHS Data Security and Protection Toolkit
  assurances. It is backed by Index Ventures. Birdie does not currently publish a
  public developer API or OpenAPI specification; this profile captures its identity,
  domain security and compliance posture.'
